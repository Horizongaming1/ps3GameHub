services:
  ps3cache-api:
    container_name: ps3cache-api
    image: ${PS3CACHE_IMAGE:-ps3cache-api:0.1.0}
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-ps3cache-api}
      APP_ENV: ${APP_ENV:-production}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/ps3cache.db}
      LIBRARY_ROOT: ${LIBRARY_ROOT:-/library}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/logs}
      LOG_FILE_NAME: ${LOG_FILE_NAME:-app.log}
      SCAN_ON_STARTUP: ${SCAN_ON_STARTUP:-true}
      SCAN_RECURSIVE: ${SCAN_RECURSIVE:-true}
      WORKER_POLL_INTERVAL_SEC: ${WORKER_POLL_INTERVAL_SEC:-2}
      WORKER_COPY_CHUNK_SIZE: ${WORKER_COPY_CHUNK_SIZE:-1048576}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-1}
      FTP_TIMEOUT_SEC: ${FTP_TIMEOUT_SEC:-20}
      WEBMAN_TIMEOUT_SEC: ${WEBMAN_TIMEOUT_SEC:-4}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${LIBRARY_HOST_PATH:-/srv/dev-disk-by-uuid-REPLACE/ps3library}:/library:ro
      - ./data:/data
      - ./config:/config
      - ./logs:/logs
    ports:
      - "${API_PUBLIC_PORT:-8087}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
